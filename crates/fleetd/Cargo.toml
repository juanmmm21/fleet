[package]
name = "fleetd"
description = "Daemon for fleet: runs tasks and serves the HTTP API on 127.0.0.1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fleet-core.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
nix = { workspace = true, features = ["hostname"] }
reqwest.workspace = true
rustls.workspace = true
tower = { workspace = true, features = ["util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

[lints]
workspace = true
