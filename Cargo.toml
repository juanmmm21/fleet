[workspace]
resolver = "3"
members = ["crates/fleet-core", "crates/fleetd", "crates/fleet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["juanmmm21"]
repository = "https://github.com/juanmmm21/fleet"

[workspace.dependencies]
fleet-core = { path = "crates/fleet-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
