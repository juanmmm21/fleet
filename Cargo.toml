[workspace]
resolver = "3"
members = ["crates/fleet-core", "crates/fleetd", "crates/fleet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["juanmmm21"]
repository = "https://github.com/juanmmm21/fleet"

[workspace.dependencies]
fleet-core = { path = "crates/fleet-core" }
fleetd = { path = "crates/fleetd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", default-features = false }
nix = { version = "0.32", default-features = false }
tempfile = "3.27"
rusqlite = { version = "0.43", features = ["bundled"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
anyhow = "1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", default-features = false }
http-body-util = "0.1"
ureq = { version = "3.5", default-features = false, features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
